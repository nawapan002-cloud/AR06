<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Robot Code Runner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        mono: ['Share Tech Mono', 'monospace'],
                    },
                    colors: {
                        cyber: {
                            dark: '#05050a',
                            card: '#0f1020',
                            border: '#2a2b4a',
                            cyan: '#00f0ff',
                            magenta: '#ff007f',
                            yellow: '#f3e600',
                            green: '#00ff66'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: #05050a;
            color: #e0e0e0;
            overflow-x: hidden;
        }
        .font-cyber {
            font-family: 'Orbitron', sans-serif;
        }
        .neon-box-cyan {
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3), inset 0 0 10px rgba(0, 240, 255, 0.1);
        }
        .neon-box-magenta {
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.3), inset 0 0 10px rgba(255, 0, 127, 0.1);
        }
        .neon-text-cyan {
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.7);
        }
        .neon-text-magenta {
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.7);
        }
        .neon-text-yellow {
            text-shadow: 0 0 10px rgba(243, 230, 0, 0.7);
        }
        .grid-bg {
            background-image: linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #090a16;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2b4a;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #00f0ff;
        }
    </style>
</head>
<body class="min-h-screen grid-bg flex flex-col justify-between selection:bg-cyan-500 selection:text-black">

    <header class="w-full border-b border-cyber-border bg-cyber-card/80 backdrop-blur-md sticky top-0 z-50 px-4 py-3">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-cyber-cyan/10 border border-cyber-cyan flex items-center justify-center neon-box-cyan">
                    <span class="text-xl">🤖</span>
                </div>
                <div>
                    <h1 class="font-cyber font-black tracking-wider text-lg sm:text-xl text-cyber-cyan neon-text-cyan">CYBER-ROBOT // 2077</h1>
                    <p class="text-xs text-gray-400">Algorithmic Puzzle Protocol v2.5</p>
                </div>
            </div>
            
            <div class="flex items-center gap-4">
                <div id="level-indicator" class="px-3 py-1 bg-cyber-dark border border-cyber-border rounded text-xs font-cyber tracking-widest text-cyber-yellow">
                    LEVEL 1 / 4
                </div>
                <button onclick="toggleSound()" id="sound-btn" class="px-3 py-1 bg-cyber-dark hover:bg-cyber-border border border-cyber-border rounded text-xs transition flex items-center gap-1.5">
                    🔊 <span id="sound-status">AUDIO ON</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        
        <!-- Left Panel: Grid & Status -->
        <section class="lg:col-span-7 flex flex-col gap-4">
            <!-- Message HUD -->
            <div class="w-full bg-cyber-card border border-cyber-border rounded-xl p-3 shadow-lg flex items-center justify-center min-h-[56px] relative overflow-hidden">
                <div class="absolute inset-0 bg-gradient-to-r from-transparent via-cyan-500/5 to-transparent pointer-events-none"></div>
                <div id="message-box" class="text-center text-sm md:text-base font-bold tracking-wider text-cyber-cyan neon-text-cyan">
                    SELECT COMMANDS AND PRESS RUN
                </div>
            </div>

            <!-- Game Board Viewport -->
            <div class="bg-cyber-card border border-cyber-border rounded-2xl p-4 sm:p-6 shadow-2xl relative flex flex-col items-center justify-center neon-box-cyan">
                <!-- Decorative tech corners -->
                <div class="absolute top-2 left-2 text-[10px] text-gray-500 font-mono">[SYS_GRID_VIEW]</div>
                <div class="absolute top-2 right-2 flex gap-1">
                    <div class="w-2 h-2 rounded-full bg-red-500/50"></div>
                    <div class="w-2 h-2 rounded-full bg-yellow-500/50"></div>
                    <div class="w-2 h-2 rounded-full bg-green-500/50"></div>
                </div>

                <!-- Grid Canvas Container -->
                <div id="game-grid" class="grid gap-2 my-4 p-2 bg-cyber-dark/80 rounded-xl border border-cyber-border shadow-inner">
                    <!-- Dynamic Grid Generated by JS -->
                </div>

                <!-- Legend -->
                <div class="flex flex-wrap items-center justify-center gap-4 text-xs text-gray-400 mt-2 border-t border-cyber-border/50 pt-3 w-full">
                    <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-cyan-400 inline-block"></span> Robot</div>
                    <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-green-500/80 inline-block"></span> Target Node</div>
                    <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-red-500/80 inline-block"></span> Laser Wall</div>
                </div>
            </div>
        </section>

        <!-- Right Panel: Command Stack & Controls -->
        <section class="lg:col-span-5 flex flex-col gap-4">
            <!-- Command Queue Container -->
            <div class="bg-cyber-card border border-cyber-border rounded-2xl p-5 shadow-xl flex flex-col h-[320px]">
                <div class="flex justify-between items-center mb-3 pb-2 border-b border-cyber-border">
                    <h2 class="font-cyber font-bold text-sm tracking-wider text-cyber-magenta neon-text-magenta flex items-center gap-2">
                        <span>⚡</span> COMMAND QUEUE
                    </h2>
                    <span id="queue-count" class="text-xs text-gray-400 font-mono">0 / 15</span>
                </div>

                <!-- Queue List Area -->
                <div id="command-queue" class="flex-1 overflow-y-auto flex flex-wrap content-start gap-2 p-2 bg-cyber-dark/60 rounded-xl border border-cyber-border/60 relative">
                    <div id="empty-queue-text" class="absolute inset-0 flex items-center justify-center text-gray-500 text-xs italic tracking-wider pointer-events-none">
                        // QUEUE EMPTY. ADD INSTRUCTIONS.
                    </div>
                </div>

                <!-- Queue Action Buttons -->
                <div class="flex gap-2 mt-3 pt-2">
                    <button onclick="removeLastCommand()" class="flex-1 py-2 bg-cyber-dark hover:bg-red-950/40 text-red-400 border border-red-500/30 rounded-lg text-xs font-cyber tracking-wider transition">
                        BACKSPACE
                    </button>
                    <button onclick="clearCommands()" class="flex-1 py-2 bg-cyber-dark hover:bg-red-950/40 text-red-400 border border-red-500/30 rounded-lg text-xs font-cyber tracking-wider transition">
                        CLEAR ALL
                    </button>
                </div>
            </div>

            <!-- Command Palette -->
            <div class="bg-cyber-card border border-cyber-border rounded-2xl p-5 shadow-xl flex flex-col gap-3">
                <h2 class="font-cyber font-bold text-sm tracking-wider text-cyber-cyan neon-text-cyan flex items-center gap-2">
                    <span>🎮</span> INSTRUCTION PALETTE
                </h2>
                
                <div class="grid grid-cols-3 gap-2.5">
                    <button onclick="addCommand('forward')" id="btn-forward" class="py-3 px-2 bg-cyan-500/10 hover:bg-cyan-500/20 border border-cyan-400/50 rounded-xl text-cyan-300 font-cyber font-bold text-xs flex flex-col items-center gap-1 transition neon-box-cyan">
                        <span class="text-lg">⬆️</span>
                        <span>STEP FORWARD</span>
                    </button>
                    <button onclick="addCommand('turn-left')" id="btn-left" class="py-3 px-2 bg-purple-600/10 hover:bg-purple-600/20 border border-purple-400/50 rounded-xl text-purple-300 font-cyber font-bold text-xs flex flex-col items-center gap-1 transition">
                        <span class="text-lg">↺</span>
                        <span>TURN LEFT</span>
                    </button>
                    <button onclick="addCommand('turn-right')" id="btn-right" class="py-3 px-2 bg-purple-600/10 hover:bg-purple-600/20 border border-purple-400/50 rounded-xl text-purple-300 font-cyber font-bold text-xs flex flex-col items-center gap-1 transition">
                        <span class="text-lg">↻</span>
                        <span>TURN RIGHT</span>
                    </button>
                </div>

                <!-- Run Execution Button -->
                <button onclick="runAlgorithm()" id="run-btn" class="w-full mt-2 py-3.5 bg-gradient-to-r from-cyber-cyan to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-black font-cyber font-black tracking-widest rounded-xl transition shadow-lg neon-box-cyan flex items-center justify-center gap-2 cursor-pointer active:scale-[0.98]">
                    <span>▶ EXECUTE PROGRAM</span>
                </button>
            </div>
        </section>
    </main>

    <footer class="w-full text-center py-4 border-t border-cyber-border/50 text-xs text-gray-500 font-mono">
        CYBER-ROBOT PUZZLE SYSTEM // AUTHORIZED ACCESS ONLY
    </footer>

    <script>
        // Audio Synthesizer using Web Audio API
        class SoundEngine {
            constructor() {
                this.enabled = true;
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
            }

            playTone(freq, type, duration, vol = 0.1) {
                if (!this.enabled) return;
                try {
                    this.init();
                    if (this.ctx.state === 'suspended') {
                        this.ctx.resume();
                    }
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) {
                    // Audio context might fail before user interaction
                }
            }

            click() { this.playTone(600, 'sine', 0.05, 0.05); }
            move() { this.playTone(300, 'triangle', 0.1, 0.08); }
            turn() { this.playTone(450, 'square', 0.08, 0.05); }
            win() {
                if (!this.enabled) return;
                const now = this.ctx ? this.ctx.currentTime : 0;
                setTimeout(() => this.playTone(523.25, 'sine', 0.15, 0.1), 0);
                setTimeout(() => this.playTone(659.25, 'sine', 0.15, 0.1), 150);
                setTimeout(() => this.playTone(783.99, 'sine', 0.15, 0.1), 300);
                setTimeout(() => this.playTone(1046.50, 'sine', 0.4, 0.15), 450);
            }
            lose() {
                if (!this.enabled) return;
                setTimeout(() => this.playTone(220, 'sawtooth', 0.2, 0.1), 0);
                setTimeout(() => this.playTone(180, 'sawtooth', 0.3, 0.1), 200);
            }
        }

        const sounds = new SoundEngine();

        function toggleSound() {
            sounds.enabled = !sounds.enabled;
            const statusEl = document.getElementById('sound-status');
            statusEl.innerText = sounds.enabled ? "AUDIO ON" : "AUDIO OFF";
            sounds.click();
        }

        // Game State & Levels Definition
        const gridSize = 5;
        let currentLevelIndex = 0;
        let commands = [];
        let isRunning = false;
        let robot = { x: 0, y: 0, dir: 0 }; // dir: 0=Right, 1=Down, 2=Left, 3=Up

        const levels = [
            {
                name: "LEVEL 1: STRAIGHTAWAY",
                start: { x: 0, y: 2, dir: 0 },
                goal: { x: 4, y: 2 },
                walls: []
            },
            {
                name: "LEVEL 2: CORNERING",
                start: { x: 0, y: 0, dir: 0 },
                goal: { x: 4, y: 4 },
                walls: [
                    { x: 2, y: 0 },
                    { x: 2, y: 1 },
                    { x: 2, y: 2 }
                ]
            },
            {
                name: "LEVEL 3: MAZE RUNNER",
                start: { x: 0, y: 4, dir: 3 },
                goal: { x: 4, y: 0 },
                walls: [
                    { x: 1, y: 4 },
                    { x: 1, y: 3 },
                    { x: 3, y: 1 },
                    { x: 3, y: 2 }
                ]
            },
            {
                name: "LEVEL 4: TACTICAL MAZE",
                start: { x: 2, y: 4, dir: 3 },
                goal: { x: 2, y: 0 },
                walls: [
                    { x: 1, y: 2 },
                    { x: 3, y: 2 },
                    { x: 2, y: 2 }
                ]
            }
        ];

        function initLevel() {
            isRunning = false;
            commands = [];
            const level = levels[currentLevelIndex];
            robot = { ...level.start };
            
            document.getElementById('level-indicator').innerText = `LEVEL ${currentLevelIndex + 1} / ${levels.length}`;
            showMessage(level.name, "text-cyber-cyan neon-text-cyan");
            
            updateCommandUI();
            renderBoard();
            document.getElementById('run-btn').disabled = false;
        }

        function renderBoard() {
            const gridEl = document.getElementById('game-grid');
            gridEl.style.gridTemplateColumns = `repeat(${gridSize}, minmax(0, 1fr))`;
            gridEl.innerHTML = '';

            const level = levels[currentLevelIndex];

            for (let y = 0; y < gridSize; y++) {
                for (let x = 0; x < gridSize; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'w-12 h-12 sm:w-14 sm:h-14 rounded-lg bg-cyber-dark border border-cyber-border/80 flex items-center justify-center relative transition-all duration-300';
                    
                    // Check Target Node
                    if (level.goal.x === x && level.goal.y === y) {
                        cell.classList.add('bg-green-950/20', 'border-green-500/40');
                        const goalMarker = document.createElement('div');
                        goalMarker.className = 'w-4 h-4 rounded-full bg-green-500 shadow-[0_0_10px_#00ff66] animate-pulse';
                        cell.appendChild(goalMarker);
                    }

                    // Check Wall
                    const isWall = level.walls.some(w => w.x === x && w.y === y);
                    if (isWall) {
                        cell.classList.add('bg-red-950/30', 'border-red-500/60');
                        const wallMarker = document.createElement('div');
                        wallMarker.className = 'w-6 h-6 rounded bg-red-600/60 border border-red-400 flex items-center justify-center text-[10px] text-white font-bold shadow-[0_0_8px_#ff0000]';
                        wallMarker.innerText = '⚡';
                        cell.appendChild(wallMarker);
                    }

                    // Check Robot Position
                    if (robot.x === x && robot.y === y) {
                        const robotEl = document.createElement('div');
                        robotEl.className = 'w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-cyan-500/20 border-2 border-cyan-400 flex items-center justify-center text-lg sm:text-xl shadow-[0_0_12px_#00f0ff] transform transition-transform duration-300';
                        
                        let rotClasses = '';
                        if (robot.dir === 0) rotClasses = 'rotate-0';
                        if (robot.dir === 1) rotClasses = 'rotate-90';
                        if (robot.dir === 2) rotClasses = 'rotate-180';
                        if (robot.dir === 3) rotClasses = '-rotate-90';
                        
                        robotEl.classList.add(rotClasses);
                        robotEl.innerText = '🤖';
                        
                        // Clear cell contents if robot is on top of goal or empty
                        cell.innerHTML = '';
                        cell.appendChild(robotEl);

                        // If robot reached goal on this render
                        if (level.goal.x === x && level.goal.y === y) {
                            const glow = document.createElement('div');
                            glow.className = 'absolute inset-0 bg-green-500/10 rounded-lg animate-ping pointer-events-none';
                            cell.appendChild(glow);
                        }
                    }

                    gridEl.appendChild(cell);
                }
            }
        }

        function addCommand(cmd) {
            if (isRunning) return;
            if (commands.length >= 15) {
                showMessage("QUEUE LIMIT REACHED (MAX 15)!", "text-red-400");
                return;
            }
            sounds.click();
            commands.push(cmd);
            updateCommandUI();
        }

        function removeLastCommand() {
            if (isRunning || commands.length === 0) return;
            sounds.click();
            commands.pop();
            updateCommandUI();
        }

        function clearCommands() {
            if (isRunning) return;
            sounds.click();
            commands = [];
            updateCommandUI();
        }

        function updateCommandUI() {
            const queue = document.getElementById('command-queue');
            const emptyText = document.getElementById('empty-queue-text');
            const countEl = document.getElementById('queue-count');
            queue.innerHTML = '';
            
            countEl.innerText = `${commands.length} / 15`;

            if (commands.length === 0) {
                emptyText.style.display = 'block';
                queue.appendChild(emptyText);
            } else {
                emptyText.style.display = 'none';
                commands.forEach((cmd) => {
                    const cmdEl = document.createElement('span');
                    let icon = '';
                    let styles = '';
                    
                    if (cmd === 'forward') { icon = '⬆️'; styles = 'bg-cyan-500 text-black border-cyan-300'; }
                    if (cmd === 'turn-left') { icon = '↺'; styles = 'bg-purple-600 text-white border-purple-400'; }
                    if (cmd === 'turn-right') { icon = '↻'; styles = 'bg-purple-600 text-white border-purple-400'; }
                    
                    cmdEl.className = `px-2 py-1 rounded border-2 font-bold text-sm ${styles} shadow-md`;
                    cmdEl.innerText = `${icon}`;
                    queue.appendChild(cmdEl);
                });
            }
        }

        function showMessage(msg, colorClass) {
            const msgBox = document.getElementById('message-box');
            msgBox.className = `text-center text-sm md:text-base font-bold tracking-wider ${colorClass}`;
            msgBox.innerText = msg;
        }

        const delay = ms => new Promise(res => setTimeout(res, ms));

        async function resetLevelWithDelay(message) {
            sounds.lose();
            showMessage(message, "text-red-500");
            await delay(1500);
            initLevel();
        }

        async function runAlgorithm() {
            if (isRunning || commands.length === 0) return;
            isRunning = true;
            document.getElementById('run-btn').disabled = true;
            showMessage(">> EXECUTING PROGRAM...", "text-cyan-400 neon-text-cyan");

            const level = levels[currentLevelIndex];
            
            robot = { ...level.start };
            renderBoard();
            await delay(500);

            for (let i = 0; i < commands.length; i++) {
                const cmd = commands[i];
                
                if (cmd === 'forward') {
                    let nextX = robot.x;
                    let nextY = robot.y;
                    
                    if (robot.dir === 0) nextX++;
                    if (robot.dir === 1) nextY++;
                    if (robot.dir === 2) nextX--;
                    if (robot.dir === 3) nextY--;

                    if (nextX < 0 || nextX >= gridSize || nextY < 0 || nextY >= gridSize) {
                        renderBoard();
                        await resetLevelWithDelay("GAME OVER! OUT OF BOUNDS!");
                        document.getElementById('run-btn').disabled = false;
                        return;
                    }

                    const isWall = level.walls.some(w => w.x === nextX && w.y === nextY);
                    if (isWall) {
                        renderBoard();
                        await resetLevelWithDelay("CRASH! HIT A LASER WALL!");
                        document.getElementById('run-btn').disabled = false;
                        return;
                    }

                    robot.x = nextX;
                    robot.y = nextY;
                    sounds.move();

                } else if (cmd === 'turn-left') {
                    robot.dir = (robot.dir + 3) % 4;
                    sounds.turn();
                } else if (cmd === 'turn-right') {
                    robot.dir = (robot.dir + 1) % 4;
                    sounds.turn();
                }

                renderBoard();
                await delay(500);
            }

            if (robot.x === level.goal.x && robot.y === level.goal.y) {
                sounds.win();
                showMessage("MISSION ACCOMPLISHED! 🎉", "text-green-400");
                await delay(2000);
                
                currentLevelIndex++;
                if (currentLevelIndex < levels.length) {
                    initLevel();
                } else {
                    showMessage("🏆 YOU WIN! ALL STAGES CLEARED!", "text-cyber-yellow neon-text-yellow");
                    isRunning = false;
                }
            } else {
                await resetLevelWithDelay("MISSION FAILED! GOAL NOT REACHED!");
            }
            
            document.getElementById('run-btn').disabled = false;
        }

        // Initialize Level on load
        initLevel();
    </script>
</body>
</html>
